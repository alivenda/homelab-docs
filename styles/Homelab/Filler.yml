extends: substitution
message: "Cut the filler: use '%s' instead of '%s'."
link: https://developers.google.com/style/word-list
level: warning
ignorecase: true
action:
  name: replace
# Google.WordList covers product-name casing, not these. 'via' alone accounts
# for 121 hits in this corpus — the single largest mechanical fix in the
# rewrite.
swap:
  via: by using|with|through
  in order to: to
  note that: ""
  allows you to: lets you
  allow you to: let you
  utilize: use
  utilizes: uses
  leverage: use
  leverages: uses
  desired: the one you want
  and/or: and|or
  simply: ""
  basically: ""
  obviously: ""
  of course: ""
