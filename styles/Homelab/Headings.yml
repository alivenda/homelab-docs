extends: capitalization
message: "'%s' should use sentence-style capitalization."
link: https://developers.google.com/style/capitalization
level: warning
scope: heading
match: $sentence
# Google.Headings with this project's proper nouns added. Google's own copy
# exempts Azure, Docker, Kubernetes and a dozen more; without the homelab
# equivalents the rule fires on every service name in a heading and the signal
# is lost. Google.Headings is disabled in .vale.ini so these two don't stack.
#
# No `indicators: [":"]` — the guide says the first word after a colon is
# generally lowercase, and Google.Colons enforces that.
exceptions:
