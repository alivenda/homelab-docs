# Pre-merge docs gate, ported from .github/workflows/docs.yml. GitHub Actions
# only ran on the GitHub push mirror, which never sees Forgejo (AGit) pull
# requests — so the strict build gated nothing until after merge. Woodpecker
# (the cluster's CI engine) hooks Forgejo PRs directly, same as the
# homelab-manifests kubeconform gate.
#
# The check is preserved exactly: pip install -r requirements.txt, then
# `mkdocs build --strict` (broken internal links/anchors fail the build).
# python:slim is multi-arch (the agents are arm64 CM4s); mkdocs-material and
# friends ship pure-Python wheels, so the install is quick even on a Pi.

when:
  - event: pull_request
    branch: main
  - event: push
    branch: main

steps:
  mkdocs-strict:
    image: python:3.13-slim
    # Measured peak: ~105 MiB over a ~55s run. Requests give co-tenants a
    # proportional CPU share; no CPU limit, matching the renovate CronJob.
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
    commands:
      - pip install --quiet --root-user-action=ignore -r requirements.txt
      - mkdocs build --strict

  # Prose lint against the Google developer documentation style guide, using
  # Vale's official Google package plus the project-local Homelab style
  # (styles/Homelab/). `vale sync` fetches the Google package at run time; it is
  # not vendored, so a package update lands without a commit here.
  #
  # The step reports findings without failing on them, but still fails on a
  # broken lint setup. `--no-exit` makes vale exit 0 when it finds warnings;
  # without it the step would be red from the first run (the corpus starts at
  # 734 warnings) and `failure: ignore` would then hide a genuinely broken
  # step forever — the two states look identical.
  #
  # `vale ls-config` is the canary. It exits 2 on a bad StylesPath or a missing
  # style, where `vale sync` exits 0 for both. Ordering matters: validate the
  # config, then fetch, then lint.
  #
  # Making the lint blocking is a one-line change — drop `--no-exit` — once the
  # corpus reaches zero. That is its own PR, not a silent change.
  # Digest-pinned like the notify step; jdkato/vale:v3.18.0 is multi-arch and
  # runs on the arm64 agents.
  vale:
    image: docker.io/jdkato/vale:v3.18.0@sha256:a947680f6e98ef8bbfcb0323293bcac8a8f4cbffcdf2401c7bf5e13c4bc2cb57
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
    commands:
      - vale ls-config > /dev/null
      - vale sync
      - vale --no-exit --minAlertLevel=warning docs/

  # Push-notify on failure: ntfy topic `ci`, publisher `woodpecker` (write-only,
  # topic-scoped). `ntfy_token` is an org-level Woodpecker secret shared by all
  # four repos — it must be enabled for push AND pull_request events, or
  # renovate-PR failures stay silent. Everything is $$-escaped so the shell
  # expands at runtime; Woodpecker's parse-time substitution would splice the
  # raw commit message into the command line. Digest-pinned: a mutable-tag
  # rebuild has already broken a green pipeline (homelab-manifests kubeconform).
  notify-failure:
    image: docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    when:
      - status: [failure]
    environment:
      NTFY_TOKEN:
        from_secret: ntfy_token
    commands:
      - |
        curl -fsS \
          -H "Authorization: Bearer $${NTFY_TOKEN}" \
          -H "Title: CI failed: $${CI_REPO_NAME} #$${CI_PIPELINE_NUMBER} ($${CI_PIPELINE_EVENT})" \
          -H "Priority: high" \
          -H "Tags: rotating_light" \
          -H "Click: $${CI_PIPELINE_URL}" \
          -d "$${CI_COMMIT_BRANCH}: $${CI_COMMIT_MESSAGE}" \
          https://ntfy.alivenda.dev/ci
