# Pre-merge docs gate, ported from .github/workflows/docs.yml. GitHub Actions
# only ran on the GitHub push mirror, which never sees Forgejo (AGit) pull
# requests — so the strict build gated nothing until after merge. Woodpecker
# (the cluster's CI engine) hooks Forgejo PRs directly, same as the
# homelab-manifests kubeconform gate.
#
# The check is preserved exactly: pip install -r requirements.txt, then
# `mkdocs build --strict` (broken internal links/anchors fail the build).
# python:slim is multi-arch (the agents are arm64 CM4s); mkdocs-material and
# friends ship pure-Python wheels, so the install is quick even on a Pi.

when:
  - event: pull_request
    branch: main
  - event: push
    branch: main

steps:
  mkdocs-strict:
    image: python:3.13-slim
    # Measured peak: ~105 MiB over a ~55s run. Requests give co-tenants a
    # proportional CPU share; no CPU limit, matching the renovate CronJob.
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
    commands:
      - pip install --quiet --root-user-action=ignore -r requirements.txt
      - mkdocs build --strict

  # Push-notify on failure: ntfy topic `ci`, publisher `woodpecker` (write-only,
  # topic-scoped). `ntfy_token` is an org-level Woodpecker secret shared by all
  # four repos — it must be enabled for push AND pull_request events, or
  # renovate-PR failures stay silent. Everything is $$-escaped so the shell
  # expands at runtime; Woodpecker's parse-time substitution would splice the
  # raw commit message into the command line. Digest-pinned: a mutable-tag
  # rebuild has already broken a green pipeline (homelab-manifests kubeconform).
  notify-failure:
    image: docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    when:
      - status: [failure]
    environment:
      NTFY_TOKEN:
        from_secret: ntfy_token
    commands:
      - |
        curl -fsS \
          -H "Authorization: Bearer $${NTFY_TOKEN}" \
          -H "Title: CI failed: $${CI_REPO_NAME} #$${CI_PIPELINE_NUMBER} ($${CI_PIPELINE_EVENT})" \
          -H "Priority: high" \
          -H "Tags: rotating_light" \
          -H "Click: $${CI_PIPELINE_URL}" \
          -d "$${CI_COMMIT_BRANCH}: $${CI_COMMIT_MESSAGE}" \
          https://ntfy.alivenda.dev/ci
