# Pre-merge docs gate, ported from .github/workflows/docs.yml. GitHub Actions
# only ran on the GitHub push mirror, which never sees Forgejo (AGit) pull
# requests — so the strict build gated nothing until after merge. Woodpecker
# (the cluster's CI engine) hooks Forgejo PRs directly, same as the
# homelab-manifests kubeconform gate.
#
# The check is preserved exactly: pip install -r requirements.txt, then
# `mkdocs build --strict` (broken internal links/anchors fail the build).
# python:slim is multi-arch (the agents are arm64 CM4s); mkdocs-material and
# friends ship pure-Python wheels, so the install is quick even on a Pi.

when:
  - event: pull_request
    branch: main
  - event: push
    branch: main

# Full history, not Woodpecker's default shallow, treeless clone
# (--depth=1 --filter=tree:0), so the gitleaks step can scan every commit.
# Same tag as Woodpecker 3.19's default clone image, digest-pinned because this
# step holds the clone credentials. Any woodpeckerci/plugin-git image stays on
# the trusted-clone list, so the clone keeps them.
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      partial: false
      depth: 0

steps:
  # Secret scan over the full history. The pre-commit gitleaks hook scans only
  # staged changes: it guards local commits but checks nothing in a CI clone.
  # --redact keeps finding values out of the log; reviewed false positives go
  # in .gitleaksignore. Measured: about 90 MiB peak and under 2 seconds on a
  # CM4.
  #
  # gitleaks exits 0 when git fails or the history is missing, so a dropped
  # clone block or a broken git would pass without scanning anything. The
  # first two commands fail the step on a shallow or partial clone, and
  # outside a readable repo.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
    commands:
      - test "$(git rev-parse --is-shallow-repository)" = false
      - test -z "$(git config --get remote.origin.partialclonefilter)"
      - gitleaks git --redact --no-banner --verbose .

  mkdocs-strict:
    image: python:3.13-slim
    # Measured peak: ~105 MiB over a ~55s run. Requests give co-tenants a
    # proportional CPU share; no CPU limit, matching the renovate CronJob.
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
    commands:
      - pip install --quiet --root-user-action=ignore -r requirements.txt
      - mkdocs build --strict

  # Prose lint against the Google developer documentation style guide, using
  # Vale's official Google package plus the project-local Homelab style
  # (styles/Homelab/). `vale sync` fetches the Google package at run time; it is
  # not vendored, so a package update lands without a commit here.
  #
  # The step fails on any warning-or-above finding. Vale's own exit code covers
  # only error-level findings, and every Homelab rule is a warning, so the step
  # also fails whenever Vale prints anything. Findings are written to a file first
  # so they still print when Vale exits non-zero.
  #
  # `vale ls-config` is the canary. It exits 2 on a bad StylesPath or a missing
  # style, where `vale sync` exits 0 for both. Ordering matters: validate the
  # config, then fetch, then lint.
  #
  # Digest-pinned like the notify step; jdkato/vale:v3.18.0 is multi-arch and
  # runs on the arm64 agents.
  vale:
    image: docker.io/jdkato/vale:v3.18.0@sha256:a947680f6e98ef8bbfcb0323293bcac8a8f4cbffcdf2401c7bf5e13c4bc2cb57
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
    commands:
      - vale ls-config > /dev/null
      - vale sync
      - vale --minAlertLevel=warning --output=line docs/ > /tmp/vale.out || { cat /tmp/vale.out; exit 1; }
      - cat /tmp/vale.out
      - test ! -s /tmp/vale.out

  # Push-notify on failure: ntfy topic `ci`, publisher `woodpecker` (write-only,
  # topic-scoped). `ntfy_token` is a Woodpecker secret on the `bedrock`
  # org, shared by all five repos — it must be enabled for push AND pull_request
  # events, or renovate-PR failures stay silent. Everything is $$-escaped so
  # the shell expands at runtime; Woodpecker's parse-time substitution would
  # splice the raw commit message into the command line. Digest-pinned: a
  # mutable-tag rebuild has already broken a green pipeline (homelab-manifests
  # kubeconform).
  notify-failure:
    image: docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    when:
      - status: [failure]
    environment:
      NTFY_TOKEN:
        from_secret: ntfy_token
    commands:
      - |
        curl -fsS \
          -H "Authorization: Bearer $${NTFY_TOKEN}" \
          -H "Title: CI failed: $${CI_REPO_NAME} #$${CI_PIPELINE_NUMBER} ($${CI_PIPELINE_EVENT})" \
          -H "Priority: high" \
          -H "Tags: rotating_light" \
          -H "Click: $${CI_PIPELINE_URL}" \
          -d "$${CI_COMMIT_BRANCH}: $${CI_COMMIT_MESSAGE}" \
          https://ntfy.alivenda.dev/ci
