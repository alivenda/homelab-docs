StylesPath = styles
MinAlertLevel = suggestion
Packages = Google

Vocab = Homelab

[*.md]
BasedOnStyles = Vale, Google, Homelab
# Anchor pins ({ #old-id }) contain lowercase product names that Vale.Terms
# flags as casing errors. These pins preserve inbound links and can't change.
TokenIgnores = \x7b [#][^\x7d]+ \x7d, Let's Encrypt

# Google.Headings ships an exceptions list with no homelab terms in it, so it
# flags every product name in a heading. Homelab.Headings is the same rule with
# this project's proper nouns added.
Google.Headings = NO

# Vale's built-in spellcheck flags every chart, namespace, and product name in
# prose. Google.Spelling still runs and catches real misspellings, so turning
# this off loses little.
#
# Side effect: styles/config/vocabularies/Homelab/accept.txt no longer feeds
# spelling. It still drives Vale.Terms, which enforces consistent casing for
# the names listed there — that is what catches `velero` where `Velero` is
# meant (49 hits).
Vale.Spelling = NO

# Tuned against this corpus. Each rule below was measured before being turned
# off or downgraded; the hit count is why.
#
# Acronyms (1345 hits): "Spell out 'DHCP'". This audience is the operator who
# built the cluster — DNS, NAS, SSH and friends are baseline vocabulary.
Google.Acronyms = NO
# Parens (1250 hits): "Use parentheses judiciously" fires on every parenthesis
# and names no fix.
Google.Parens = NO
# Colons (129 hits): "word after colon should be lowercase." Over 90% are false
# positives — proper nouns, acronyms, and table-cell values (e.g.,
# "**Status:** Active", "**Run:** Kubernetes"). The rule can't distinguish.
Google.Colons = NO
# Units (23 hits): "put a nonbreaking space between number and unit." Fires on
# config-style duration strings (30s, 90d, 1h) that are technical shorthand,
# not prose quantities.
Google.Units = NO
# WordList (4 hits): "use 'Google Cloud Platform' instead of 'Cloud'." This
# repo never means Google Cloud — the hits are "Terraform Cloud" and
# "Bitwarden Cloud" (product names) and generic "cloud APIs."
Google.WordList = NO
# EmDash (897 hits): the guide wants unspaced dashes. Real, but it is invisible
# typography against 897 edits, so it advises rather than blocks.
Google.EmDash = suggestion
# Semicolons (286 hits): a preference, not an error.
Google.Semicolons = suggestion
