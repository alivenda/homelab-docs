site_name: Homelab Runbooks
site_description: Turing Pi 2 + 4x CM4 k3s homelab — from zero to self-hosted everything
site_url: https://alivenda.github.io/homelab-docs/
repo_url: https://github.com/alivenda/homelab-docs
repo_name: alivenda/homelab-docs
edit_uri: edit/main/docs/

# Fail the build (with `mkdocs build --strict`) on broken internal links and
# anchors. Without this, anchor checks are INFO-level and slip through CI.
validation:
  links:
    not_found: warn
    anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys

plugins:
  - search

nav:
  - Overview: index.md
  - Get started:
      - Prerequisites: get-started/prerequisites.md
      - Set up Git: get-started/set-up-git.md
  - Concepts:
      - Repositories: concepts/repositories.md
      - Storage: concepts/storage.md
      - Identity and access: concepts/identity.md
  - Build the cluster:
      - Network: build/network.md
      - Turing Pi: build/turing-pi.md
      - Ansible: build/ansible.md
      - Kubernetes: build/kubernetes.md
      - Traefik: build/traefik.md
      - Terraform: build/terraform.md
      - Observability: build/observability.md
      - Backups: build/backups.md
  - Deploy services:
      - Deployment pattern: deploy/index.md
      - Platform services:
          - Vaultwarden: deploy/vaultwarden.md
          - Authelia and lldap: deploy/authelia.md
          - ntfy: deploy/ntfy.md
          - NAS PostgreSQL: deploy/nas-postgres.md
          - Forgejo: deploy/forgejo.md
          - Woodpecker: deploy/woodpecker.md
          - AdGuard Home: deploy/adguard-home.md
      - Applications:
          - Nextcloud: deploy/nextcloud.md
          - Paperless-ngx: deploy/paperless.md
          - Immich: deploy/immich.md
          - Home Assistant: deploy/home-assistant.md
          - Homepage: deploy/homepage.md
          - Vikunja: deploy/vikunja.md
          - Miniflux: deploy/miniflux.md
      - Planned:
          - Arr stack: deploy/arr-stack.md
          - BookStack: deploy/bookstack.md
          - Syncthing: deploy/syncthing.md
          - RustDesk: deploy/rustdesk.md
          - Reactive Resume: deploy/reactive-resume.md
          - Ollama and Open WebUI: deploy/ollama.md
  - Operations:
      - Disaster recovery: operate/disaster-recovery.md
      - Cold shutdown: operate/cold-shutdown.md
  - Reference:
      - App catalog: reference/app-catalog.md
      - Service selection: reference/service-selection.md
      - Decisions:
          - reference/decisions/index.md
          - Forgejo over GitHub: reference/decisions/forgejo-over-github.md
          - Ansible over Terraform: reference/decisions/ansible-over-terraform.md
          - SQLite on local-path storage: reference/decisions/sqlite-on-local-path.md
          - Databases on the NAS: reference/decisions/databases-on-nas.md
          - Garage over MinIO: reference/decisions/garage-over-minio.md
          - Zone-based firewall: reference/decisions/zone-based-firewall.md
          - Kubernetes backend for Woodpecker: reference/decisions/woodpecker-kubernetes-backend.md
          - Forgejo container registry: reference/decisions/forgejo-container-registry.md
          - Blackbox probes over Uptime Kuma: reference/decisions/blackbox-over-uptime-kuma.md
          - Arr stack shelved: reference/decisions/arr-stack-shelved.md
          - mkdocs-redirects dropped: reference/decisions/mkdocs-redirects-dropped.md
          - Stack gap analysis: reference/decisions/stack-gap-analysis.md
  - Release notes: release-notes.md

extra:
  generator: false
